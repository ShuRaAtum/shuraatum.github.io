    スキル:
      - name: プログラミング言語
        keywords: "C、Python、アセンブリ（ARM、RISC-V）"
      - name: 並列化・SIMD
        keywords: "ARM NEON、x86 AVX2/AVX-512、CUDA、Metal（Apple Silicon）"
      - name: 対象プラットフォーム
        keywords: "ARM Cortex-M、ARMv8（AArch64）、RISC-V（RV32/RV64）、x86-64、NVIDIA GPU、Apple M1 GPU"
