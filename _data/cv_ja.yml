  summary: >
    Hansung University 情報コンピュータ工学科の博士課程に在籍し、プラットフォームに最適化した暗号実装を専門としています。
    耐量子計算機暗号（PQC）のベンチマークと、組込み・GPU向け暗号エンジニアリングを中心に研究しており、
    SCI(E)論文誌や国際会議での発表に加え、韓国の国家暗号研究プロジェクトにも複数参加しています。

